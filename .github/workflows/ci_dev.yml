name: dbt CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  dbt_ci:
    name: Validate dbt models
    runs-on: ubuntu-latest

    env:
      DBT_TARGET: dev
      DBT_PROFILES_DIR: ./
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Install dbt packages
        run: dbt deps

      - name: Lint dbt models
        run: sqlfluff lint models/

      - name: Check Databricks connection
        run: dbt debug --target dev

      - name: Parse dbt project
        run: dbt parse --target dev

      - name: Compile dbt models
        run: dbt compile --target dev

      - name: Build models and run tests in dev
        run: dbt build --target dev

