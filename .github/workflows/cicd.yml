
name: dbt CI/CD

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

jobs:
  dbt_ci:
    runs-on: ubuntu-latest

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_CATALOG: ${{ secrets.DATABRICKS_CATALOG }}

    

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Diagnose dbt profile
        run: |
            pwd
            ls -la
            echo "DBT_PROFILES_DIR=$DBT_PROFILES_DIR"
            ls -la "$DBT_PROFILES_DIR"
            python -c "import yaml, os; p=os.path.join(os.environ['DBT_PROFILES_DIR'],'profiles.yml'); print(list(yaml.safe_load(open(p)).keys()))"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install dbt packages
        run: dbt deps

      - name: Lint dbt models
        run: "sqlfluff lint models"

      - name: Check connection
        run: dbt debug

      - name: Parse dbt project
        run: dbt parse

      - name: Build dbt models
        run: dbt build --full-refresh --profiles-dir ./
